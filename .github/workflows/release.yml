name: Release

# On every push to main (PR merge or direct push) or manual run, read the version from pubspec.yaml,
# tag it (vX.Y.Z), build the 64-bit and 32-bit APKs and publish them as GitHub release assets
# named zm6-vX.Y.Z.apk and zm6-vX.Y.Z-32bits.apk. If the tag already exists nothing is released.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read version from pubspec.yaml
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$VERSION" ]; then echo "version not found"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if the tag already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.ver.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'false'
        with:
          channel: stable
          cache: true

      - name: Build APK
        if: steps.check.outputs.exists == 'false'
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "zm6-${{ steps.ver.outputs.tag }}.apk"
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk "zm6-${{ steps.ver.outputs.tag }}-32bits.apk"

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "zm6-${{ steps.ver.outputs.tag }}.apk" \
            "zm6-${{ steps.ver.outputs.tag }}-32bits.apk" \
            --target "${{ github.sha }}" \
            --title "ZM6 ${{ steps.ver.outputs.tag }}" \
            --notes "Release ${{ steps.ver.outputs.tag }}. See CHANGELOG.md for details."
